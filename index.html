<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obhavo — Kunlik Ob-havo Kuzatuvi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="sky-strip" id="skyStrip"></div>

  <main class="app">

    <header class="hero" id="hero">
      <div class="hero-top">
        <span class="eyebrow">Bugungi ob-havo</span>
        <form class="search" id="searchForm" autocomplete="off">
          <input type="text" id="cityInput" placeholder="Shahar nomini kiriting…" />
          <button type="submit" aria-label="Qidirish">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </form>
      </div>

      <div id="suggestions" class="suggestions"></div>

      <div class="hero-main" id="heroMain">
        <div class="loading" id="loadingState">
          <div class="spinner"></div>
          <p>Joylashuv aniqlanmoqda…</p>
        </div>
      </div>
    </header>

    <section class="detail-grid" id="detailGrid" hidden>
      <div class="detail-card">
        <span class="detail-label">Shamol</span>
        <div class="compass" id="compass">
          <svg viewBox="0 0 100 100" class="compass-svg">
            <circle cx="50" cy="50" r="46" class="compass-ring"/>
            <text x="50" y="14" class="compass-tick">Sh</text>
            <text x="88" y="54" class="compass-tick">Sh-Sh</text>
            <text x="50" y="94" class="compass-tick">J</text>
            <text x="10" y="54" class="compass-tick">G-Sh</text>
            <line x1="50" y1="50" x2="50" y2="14" class="compass-needle" id="windNeedle"/>
            <circle cx="50" cy="50" r="4" class="compass-hub"/>
          </svg>
        </div>
        <span class="detail-value" id="windValue">—</span>
      </div>

      <div class="detail-card">
        <span class="detail-label">Namlik</span>
        <div class="gauge">
          <svg viewBox="0 0 100 60" class="gauge-svg">
            <path d="M10 55 A40 40 0 0 1 90 55" class="gauge-track"/>
            <path d="M10 55 A40 40 0 0 1 90 55" class="gauge-fill" id="humidityFill"/>
          </svg>
          <span class="gauge-value" id="humidityValue">—</span>
        </div>
        <span class="detail-label">Namlik darajasi</span>
      </div>

      <div class="detail-card">
        <span class="detail-label">Yog'ingarchilik ehtimoli</span>
        <span class="detail-big" id="precipValue">—</span>
        <span class="detail-label" id="precipSum">—</span>
      </div>

      <div class="detail-card">
        <span class="detail-label">Bosim</span>
        <span class="detail-big" id="pressureValue">—</span>
        <span class="detail-label">hPa</span>
      </div>
    </section>

    <section class="forecast" id="forecastSection" hidden>
      <div class="forecast-head">
        <span class="eyebrow">7 kunlik prognoz</span>
      </div>
      <div class="forecast-row" id="forecastRow"></div>
    </section>

    <footer class="app-footer">
      <p>Ma'lumotlar manbai: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open‑Meteo</a></p>
    </footer>

  </main>

<script src="script.js"></script>
</body>
</html>
